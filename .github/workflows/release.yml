# Builds pokertui for the Asciiverse catalog: one archive per target, named
# pokertui-<target>.tar.gz (Linux, macOS) or .zip (Windows), each with the
# pokertui client and the pokertui-server binary, plus SHA256SUMS, attached
# to a GitHub release (hub/catalog/SCHEMA.md, release.source = "github").
# Runs on our tags only (*-av.*), or by hand for an existing tag. Upstream's
# cargo-dist release workflow is removed in this fork (PATCHES.md).
#
# Linux builds run in Alpine and are fully static, so they carry the -musl
# triple av looks for first.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -c '
            apk add --no-cache build-base musl-dev &&
            cargo build --release --locked &&
            asciiverse/package.sh ${{ matrix.target }} target/release'
          file stage/pokertui stage/pokertui-server

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/pokertui
          asciiverse/package.sh ${{ matrix.target }} target/${{ matrix.target }}/release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        shell: bash
        run: |
          cargo build --release --locked --target "$TARGET"
          EXE=.exe asciiverse/package.sh "$TARGET" "target/$TARGET/release"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: dist/*.zip

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-*-*"
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "pokertui $TAG" \
                 --notes "pokertui $TAG from github.com/AlexAlexBabarika/pokertui, with the changes in PATCHES.md, built for the Asciiverse catalog."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
